<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ECO-ORBIT | Interactive Twin</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #020808;
            --accent: #4ade80;
            --cyan: #22d3ee;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; background: var(--bg); color: #f1f5f9;
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh; overflow-x: hidden;
        }

        /* 氛围动态背景 */
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 10% 20%, rgba(6, 44, 45, 1) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(4, 30, 31, 1) 0%, transparent 40%);
        }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 30px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        h1 { font-weight: 800; letter-spacing: -1px; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Bento Grid */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 200px; gap: 20px; }
        
        .card {
            background: var(--glass); backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 35px;
            padding: 25px; cursor: pointer; transition: 0.4s cubic-bezier(0.2, 1, 0.2, 1);
            position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
        }
        .card:hover { transform: translateY(-8px); border-color: var(--accent); background: rgba(255,255,255,0.06); }
        
        .c-wide { grid-column: span 2; }
        .c-tall { grid-row: span 2; }

        .label { color: var(--accent); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
        .value { font-size: 52px; font-weight: 800; letter-spacing: -2px; }
        .unit { font-size: 16px; opacity: 0.3; margin-left: 8px; font-weight: 400; }

        /* 迷你图层 */
        .mini-chart { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; z-index: -1; opacity: 0.5; }

        /* 弹窗 Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: #0a0f0f; width: 90%; max-width: 900px; height: 500px;
            padding: 40px; border-radius: 40px; border: 1px solid var(--accent);
            position: relative; animation: slideUp 0.4s ease;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .close-btn { position: absolute; top: 25px; right: 25px; cursor: pointer; font-size: 24px; color: #fff; opacity: 0.5; }

        /* 日志窗 */
        .log-box { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 15px; height: 80%; overflow-y: auto; font-family: monospace; color: var(--accent); font-size: 12px; line-height: 1.6; }.control-panel{
display:flex;
justify-content:center;
gap:12px;
margin-top:16px;
}

.control-btn{

background:rgba(74,222,128,.08);

color:#4ade80;

border:1px solid rgba(74,222,128,.55);

border-radius:999px;

padding:8px 18px;

font-size:13px;

font-weight:800;

cursor:pointer;

transition:.25s;

box-shadow:
0 0 12px rgba(74,222,128,.15);

}

.control-btn:hover{

background:
rgba(74,222,128,.18);

transform:
translateY(-2px);

box-shadow:
0 0 18px rgba(74,222,128,.35);

}
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">
    <header>
        <h1 id="t-head">ECO-TWIN SYSTEM</h1>
        <button onclick="toggleLang()" style="background:transparent; color:#fff; border:1px solid var(--border); padding:8px 16px; border-radius:12px; cursor:pointer;">ZH/EN</button>
    </header>

    <div class="grid">
        <div class="card c-wide" onclick="openModal('temp', 'Temperature', '°C')">
            <div>
                <div class="label" id="t-temp">THERMAL INDEX</div>
                <div class="value"><span id="v-temp">--</span><span class="unit">°C</span></div>
            </div>
            <div class="mini-chart"><canvas id="m-temp"></canvas></div>
        </div>

    <div class="card c-tall">

    <div class="label" id="t-log">
        Eco-Automation Log
    </div>

    <div class="log-box" id="log-content">
        > System standby...
    </div>
    <div class="control-panel">


<button
class="control-btn on"

onclick="
event.stopPropagation();
sendCommand('on');
">
ON
</button>

<button
class="control-btn off"

onclick="
event.stopPropagation();
sendCommand('off');
">
OFF
</button>

<button
class="control-btn auto"

onclick="
event.stopPropagation();
sendCommand('auto');
">
AUTO
</button>

</div>


</div>

        <div class="card" onclick="openModal('TVOC', 'TVOC', 'ppb')">
            <div class="label">TVOC</div>
            <div class="value" style="font-size:38px;"><span id="v-TVOC">--</span><span class="unit">ppb</span></div>
            <div class="mini-chart"><canvas id="m-TVOC"></canvas></div>
        </div>

        <div class="card" onclick="openModal('CO2', 'eCO2', 'ppm')">
            <div class="label">CO2</div>
            <div class="value" style="font-size:38px;"><span id="v-CO2">--</span><span class="unit">ppm</span></div>
            <div class="mini-chart"><canvas id="m-CO2"></canvas></div>
        </div>

        <div class="card" onclick="openModal('AQI', 'AQI', '')">
            <div class="label">AQI</div>
            <div class="value" style="font-size:38px;"><span id="v-AQI">--</span><span class="unit"></span></div>
            <div class="mini-chart"><canvas id="m-AQI"></canvas></div>
        </div>
        <div class="card" onclick="openModal('RH', 'RH', '')">
            <div class="label">RH</div>
            <div class="value" style="font-size:38px;"><span id="v-RH">--</span><span class="unit"></span></div>
            <div class="mini-chart"><canvas id="m-RH"></canvas></div>
        </div>
    </div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">×</span>
        <h2 id="modal-title" style="margin-top:0; color:var(--accent);">History</h2>
        <div style="height: 350px;"><canvas id="detailChart"></canvas></div>
    </div>
</div>

<script>
    let lang = 'zh';
    const history = { AQI: [], temp: [], RH:[], TVOC: [], CO2: [] };
    const miniCharts = {};
    let detailChart = null;
    let activeType = null;

    // 初始化所有卡片的迷你图
    function initSpark(id, color) {
        const ctx = document.getElementById(`m-${id}`).getContext('2d');
        miniCharts[id] = new Chart(ctx, {
            type: 'line',
            data: { labels: Array(30).fill(''), datasets: [{ data: [], borderColor: color, borderWidth: 2, tension: 0.4, pointRadius: 0, fill: true, backgroundColor: color+'11' }] },
            options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } }, maintainAspectRatio: false }
        });
    }

    // 弹窗逻辑
    function openModal(type, title, unit) {
        activeType = type;
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('modal-title').innerText = `${title} (Last 60s)`;
        
        const ctx = document.getElementById('detailChart').getContext('2d');
        if(detailChart) detailChart.destroy();
        
        detailChart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: Array(60).fill(''), 
                datasets: [{ label: unit, data: history[type], borderColor: '#4ade80', backgroundColor: 'rgba(74, 222, 128, 0.1)', fill: true, tension: 0.3, pointRadius: 2 }] 
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: '#222' } }, x: { display: false } } }
        });
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; activeType = null; }

    async function update() {
        try {
            const res = await fetch('/data');
            const data = await res.json();
            
            ['AQI', 'temp','RH', 'TVOC', 'CO2'].forEach(k => {
              
              let value = data[k];

              if (value === null || value === undefined) {
                  document.getElementById(`v-${k}`).innerText = "--";
                  return;
              }

              document.getElementById(`v-${k}`).innerText = value;
              history[k].push(value);

              if (history[k].length > 60) history[k].shift();

              miniCharts[k].data.datasets[0].data = history[k].slice(-30);
              miniCharts[k].update('none');
          });

            if(activeType && detailChart) detailChart.update('none');
        } catch (e) {}
    }

    function toggleLang() {
        lang = lang === 'zh' ? 'en' : 'zh';
        document.getElementById('t-head').innerText = lang === 'zh' ? "生态数字孪生系统" : "ECO-TWIN SYSTEM";
        document.getElementById('t-temp').innerText = lang === 'zh' ? "热力指数" : "THERMAL INDEX";
        document.getElementById('t-log').innerText = lang === 'zh' ? "逻辑引擎日志" : "LOGIC ENGINE LOG";
    }

    async function sendCommand(command){

        console.log("Sending:",command);

        const res=
        await fetch(
        '/buzzer',
        {
        method:'POST',

        headers:{
        'Content-Type':
        'application/json'
        },

        body:
        JSON.stringify({
        command
        })
        }
        );

        console.log(
        await res.json()
        );

}

    initSpark('temp', '#4ade80');
    initSpark('TVOC', '#22d3ee');
    initSpark('RH', '#38bdf8');
    initSpark('CO2', '#818cf8');
    initSpark('AQI', '#facc15');
    setInterval(update, 1000);
</script>
</body>
</html>
